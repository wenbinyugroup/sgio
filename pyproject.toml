[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgio"
# version = "0.1.0"
dynamic = ["version"]
description = "I/O for VABS and SwiftComp"
authors = [
    { name = "Su Tian", email = "sutian@analyswift.com" }
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "meshio",
    "matplotlib",
    "pydantic>=2.0",
    "pyyaml",
    "scipy",
    "rich>=14.1.0",
    "plotly>=6.7.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",  # For building executables
    "sphinx>=7.4.7",
    "myst-parser>=3.0.1",
    "sphinx-immaterial>=0.12.5",
    "sphinx-design>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "pydata-sphinx-theme>=0.16.1",
    "build>=1.3.0",
    "hatchling>=1.27.0",
    "twine>=6.2.0",
]
all = [
    "h5py",
    "netCDF4",
    "pytest",
]

[project.scripts]
sgio = "sgio.__main__:main"

[project.urls]
Homepage = "https://github.com/wenbinyugroup/sgio"
Documentation = "https://wenbinyugroup.github.io/sgio/"

[tool.hatch.version]
source = "regex"
path = "sgio/_version.py"
pattern = '^__version__ = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.sdist]
only-include = [
    "sgio",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
# Without this hatch's editable install adds the project root to sys.path
# and exposes top-level directories such as `tests/`, which then shadows
# downstream projects' own `tests/` package (observed in sgbuilder).
# Restricting to the `sgio` package keeps editable installs predictable.
packages = ["sgio"]

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pyinstaller>=5.0",
]
